[api]
base_url = https://www.alphavantage.co/query
function = REAL_GDP
interval = annual

[fiscaldata]
base_url = https://api.fiscaldata.treasury.gov/services/api/fiscal_service

[data]
years_to_fetch = 10

[exchange_rate]
function = FX_DAILY
from_currency = USD
to_currency = EUR
outputsize = full

[aws]
region = eu-west-1

[storage]
bucket_name = summer-26-project
gdp_key = real_gdp/real_gdp.csv.gz
exchange_rate_key = exchange_rates/exchange_rates.csv.gz
company_overview_key = company_overview/company_overview.csv.gz
daily_stock_key = daily_stock/daily_stock.csv.gz
news_sentiment_key = news_sentiment/news_sentiment.csv.gz
operating_cash_balance_key = operating_cash_balance/operating_cash_balance.csv.gz
deposits_withdrawals_operating_cash_key = deposits_withdrawals_operating_cash/deposits_withdrawals_operating_cash.csv.gz
treasury_reporting_rates_exchange_key = treasury_reporting_rates_exchange/treasury_reporting_rates_exchange.csv.gz

[company_overview]
function = OVERVIEW
symbols = IBM,AAPL,MSFT,GOOGL,AMZN,NVDA,META,TSLA,ORCL,INTC

[daily_stock]
function = TIME_SERIES_DAILY
symbols = IBM,AAPL,MSFT,GOOGL,AMZN,NVDA,META,TSLA,ORCL,INTC
outputsize = compact

[news_sentiment]
function = NEWS_SENTIMENT
symbols = IBM,AAPL,MSFT,GOOGL,AMZN,NVDA,META,TSLA,ORCL,INTC
limit = 5

[operating_cash_balance]
endpoint = /v1/accounting/dts/operating_cash_balance
page_size = 1000

[deposits_withdrawals_operating_cash]
endpoint = /v1/accounting/dts/deposits_withdrawals_operating_cash
page_size = 1000

[treasury_reporting_rates_exchange]
endpoint = /v1/accounting/od/rates_of_exchange
page_size = 1000

[dynamodb]
state_table = summer-26-pipeline-state